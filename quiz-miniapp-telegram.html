<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тесты: назовите всех</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--ink:#14171c;--mut:#5f6673;--line:#d5d9e0;--field:#b8bec9;--cover:#dce0e6;--bar:#e3e5e9;--ok:#0b7f2e;--miss:#b42318;--card:#fff;--btn:#0b7f2e;--btnink:#fff;--okbg:#e6f4ea;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101318;--ink:#f1f3f6;--mut:#a3abb8;--line:#2a303a;--field:#3b4350;--cover:#1d222b;--bar:#2a303a;--ok:#4cc27a;--miss:#ff8a7a;--card:#171b22;--btn:#4cc27a;--btnink:#08130c;--okbg:#14301f}}
:root[data-theme="dark"]{--bg:#101318;--ink:#f1f3f6;--mut:#a3abb8;--line:#2a303a;--field:#3b4350;--cover:#1d222b;--bar:#2a303a;--ok:#4cc27a;--miss:#ff8a7a;--card:#171b22;--btn:#4cc27a;--btnink:#08130c;--okbg:#14301f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.4 Manrope,system-ui,sans-serif}
#app{max-width:480px;margin:0 auto;padding:20px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;text-align:center;font-size:22px;line-height:1.25;font-weight:800}
h2{margin:0;font-size:22px;font-weight:800}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ok);outline-offset:2px}
.btn{min-height:52px;border:0;border-radius:14px;background:var(--btn);color:var(--btnink);font-weight:700;cursor:pointer;padding:0 16px}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--field)}
.link{align-self:flex-start;min-height:44px;border:0;background:none;color:var(--mut);font-weight:600;cursor:pointer;padding:0}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mut);font-weight:600}
input,textarea{box-sizing:border-box;width:100%;border:1px solid var(--field);border-radius:16px;background:var(--card);padding:0 16px}
input{height:52px}
textarea{padding:12px 16px;resize:vertical;line-height:1.5}
.cover{position:relative;overflow:hidden;height:190px;border-radius:20px;background:var(--cover);display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:14px;font-weight:600}
.cvimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 35%}
.badge{position:absolute;left:12px;bottom:12px;padding:10px 16px;border-radius:14px;background:var(--card);color:var(--ink);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.eye{position:absolute;right:12px;bottom:12px;width:52px;height:52px;border:0;border-radius:14px;background:var(--card);color:var(--ink);cursor:pointer;display:grid;place-items:center}
.pill{position:absolute;left:50%;bottom:0;transform:translateX(-50%);padding:4px 18px;border-radius:12px 12px 0 0;background:var(--bg);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;min-height:41px;border-bottom:1px solid var(--line);font-size:14px;font-weight:600;padding:4px 0}
.row .cl{width:50%;padding-right:10px;box-sizing:border-box;color:var(--mut)}
.row .an{flex:1}
.row.ok .cl,.row.ok .an{color:var(--ok)}
.row.miss .cl,.row.miss .an{color:var(--miss)}
.bar{display:block;width:150px;max-width:100%;height:14px;border-radius:4px;background:var(--bar)}
.row.new{animation:flash .9s}
@keyframes flash{from{background:var(--okbg)}to{background:transparent}}
@media (prefers-reduced-motion:reduce){.row.new{animation:none}}
.res{display:flex;flex-direction:column;gap:12px;text-align:center}
.score{font-size:64px;line-height:1;font-weight:800;color:var(--ok)}
.score small{font-size:28px;color:var(--mut)}
.sub,.hint,.msg{color:var(--mut);font-size:13px;margin:0}
.msg{min-height:18px}
.card{display:flex;flex-direction:column;gap:6px;padding:14px 16px;border:1px solid var(--line);border-radius:16px}
.card .t{border:0;background:none;text-align:left;font-weight:700;font-size:16px;cursor:pointer;padding:0;min-height:44px}
.acts{display:flex;gap:16px}
.acts button{border:0;background:none;color:var(--mut);font-weight:600;cursor:pointer;min-height:44px;padding:0}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;max-width:90vw}
#toast.on{opacity:1}
</style>
</head>

const BUILTIN = {id:'tdd', cover:COVER, title:'С какими артистами есть совместные треки у Три дня дождя?', time:600,
 items:['MONA','тринадцать карат','МУККА','pyrokinesis','Zivert','polnalyubvi','Call Me Karizma','Lida','Неисправность','LYRIQ','HOFMANNITA','Брутто','Копюшон Ноу Мо','Polovinka','Сергей Бобунец','TRITIA','Slem','lowlife','Лали','Наша Таня','playingtheangel','INSPACE','K8MAFFIN','Yanix','Сантос','MACAN','Баста','Владимир Пресняков','Тося Чайкина','aikko','SHENA?','Masha Hima','Майвл']
  .map(n => ({name:n, clue:CLUES[n], alt:ALT[n]}))};

// После создания Mini App в BotFather вставьте сюда ссылку вида https://t.me/ваш_бот/короткое_имя
const APP_LINK = '';
const KEY='quiz.tests.v1';
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)||'[]'); } catch(e) { return []; } };
const save = a => { try { localStorage.setItem(KEY, JSON.stringify(a)); } catch(e) {} };
const allTests = () => [BUILTIN, ...load()];
const enc = t => btoa(unescape(encodeURIComponent(JSON.stringify({title:t.title,time:t.time,items:t.items}))));
const dec = h => JSON.parse(decodeURIComponent(escape(atob(h))));
const linkFor = t => location.href.split('#')[0] + '#t=' + enc(t);

let toastT; function toast(s){const e=$('#toast');e.textContent=s;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),2600);}
async function copy(text){try{await navigator.clipboard.writeText(text);toast('Ссылка скопирована');}catch(e){window.prompt('Скопируйте ссылку:',text);}}

/* ---------- game ---------- */
let G=null;
function keysOf(it){
  const ks=[it.name,...(it.alt||[])];
  const w=it.name.trim().split(/\s+/);
  if(w.length>1 && norm(w[w.length-1]).length>=5) ks.push(w[w.length-1]);
  return ks.map(norm).filter(Boolean);
}
function showGame(t){
  clearInterval(G&&G.iv);
  G={t,items:t.items,solved:new Set(),left:t.time,started:false,ended:false,iv:null,last:-1};
  $('#app').innerHTML=`
  <h1>${esc(t.title)}</h1>
  <div class="cover">${t.cover?`<img class="cvimg" src="${t.cover}" alt="">`:`<span>Назовите всех: ${t.items.length}</span>`}
    <div class="badge" id="tm">${fmt(t.time)}</div>
    <button class="eye" data-act="giveup" aria-label="Показать ответы и закончить"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
    <div class="pill" id="cnt"></div></div>
  <div id="ctl"><input id="ans" type="text" placeholder="Введите ответ" aria-label="Введите ответ" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done"><p class="msg" id="msg" aria-live="polite"></p></div>
  <div id="list" role="list"></div>`;
  paint();
  const a=$('#ans');
  a.addEventListener('input',()=>{ if(!G.started&&a.value)startTimer(); if(tryAnswer(a.value,false))a.value=''; });
  a.addEventListener('keydown',e=>{ if(e.key!=='Enter')return; if(tryAnswer(a.value,true)){a.value='';$('#msg').textContent='';} else if(a.value.trim()) $('#msg').textContent='Такого в списке нет или он уже назван'; });
}
function paint(){
  $('#cnt').textContent=G.solved.size+' / '+G.items.length;
  $('#tm').textContent=fmt(G.left);
  $('#list').innerHTML=G.items.map((it,i)=>{
    const ok=G.solved.has(i), miss=G.ended&&!ok;
    const cls=ok?'ok':miss?'miss':'';
    return `<div class="row ${cls}${i===G.last?' new':''}" role="listitem"><span class="cl">${esc(it.clue||(i+1))}</span><span class="an">${ok||miss?esc(it.name):'<span class="bar" role="img" aria-label="ответ скрыт"></span>'}</span></div>`;
  }).join('');
}
function startTimer(){
  G.started=true; const end=Date.now()+G.left*1000;
  G.iv=setInterval(()=>{G.left=Math.max(0,Math.ceil((end-Date.now())/1000));$('#tm').textContent=fmt(G.left);if(!G.left)finish();},250);
}
function tryAnswer(raw,fuzzy){
  if(G.ended)return false; const v=norm(raw); if(v.length<2)return false;
  for(let i=0;i<G.items.length;i++){ if(G.solved.has(i))continue;
    for(const k of keysOf(G.items[i])){
      const tol=fuzzy?(k.length>=12?2:k.length>=6?1:0):0;
      if(k===v||(fuzzy&&lev(v,k)<=tol)){G.solved.add(i);G.last=i;paint();if(G.solved.size===G.items.length)finish();return true;}
    }}
  return false;
}
function finish(){
  if(G.ended)return; clearInterval(G.iv); G.ended=true; G.last=-1; paint();
  $('#ctl').innerHTML=`<div class="res"><div class="score">${G.solved.size}<small> / ${G.items.length}</small></div><p class="sub">${G.left?'Осталось '+fmt(G.left):'Время вышло'}</p>
  <button class="btn" data-act="share">Поделиться результатом</button><button class="btn sec" data-act="again">Играть ещё</button></div>`;
}
async function share(){
  const text=`Я назвал ${G.solved.size} из ${G.items.length}: «${G.t.title}»`, url=(G.t.id==='tdd'&&APP_LINK)?APP_LINK:location.href.split('#')[0]+(G.t.id==='tdd'?'':'#t='+enc(G.t));
  const W=window.Telegram&&window.Telegram.WebApp;
  if(W&&W.initData&&W.openTelegramLink){W.openTelegramLink('https://t.me/share/url?url='+encodeURIComponent(url)+'&text='+encodeURIComponent(text));return;}
  try{ if(navigator.share){await navigator.share({text,url});return;} }catch(e){ if(e&&e.name==='AbortError')return; }
  copy(text+'\n'+url);
}

/* ---------- home & builder ---------- */
function showHome(){
  clearInterval(G&&G.iv);
  $('#app').innerHTML=`<h2>Тесты</h2>`+allTests().map(t=>`
  <div class="card"><button class="t" data-act="play" data-id="${esc(t.id)}">${esc(t.title)}</button>
  <span class="sub">${t.items.length} ответов · ${fmt(t.time)}</span>
  <div class="acts"><button data-act="link" data-id="${esc(t.id)}">Скопировать ссылку</button>${t.id==='tdd'?'':`<button data-act="del" data-id="${esc(t.id)}">Удалить</button>`}</div></div>`).join('')
  +`<button class="btn" data-act="build">Создать свой тест</button>`;
}
function showBuilder(){
  $('#app').innerHTML=`<button class="link" data-act="home">← Все тесты</button><h2>Новый тест</h2>
  <label class="field">Вопрос<input id="bt" type="text" placeholder="Например, назовите всех чемпионов мира по футболу"></label>
  <label class="field">Время, минут<input id="bm" type="number" min="1" max="60" value="6" inputmode="numeric"></label>
  <label class="field">Ответы, по одному на строку<textarea id="bl" rows="10" placeholder="Сергей Игнашевич | Игнашевич | 81 матч: 2001-2017&#10;Игорь Акинфеев | | 60 матчей: 2004-2018"></textarea></label>
  <p class="hint">Формат строки: <b>ответ | другие написания через запятую | подсказка</b>. Второе и третье поля можно не заполнять. Регистр, «ё» и пробелы не важны.</p>
  <p class="msg" id="bmsg" role="alert"></p>
  <button class="btn" data-act="savebuild">Сохранить и играть</button>`;
}
function saveBuild(){
  const title=$('#bt').value.trim(), mins=Math.min(60,Math.max(1,parseInt($('#bm').value,10)||6));
  const items=$('#bl').value.split('\n').map(l=>l.split('|').map(s=>s.trim())).filter(p=>p[0]).map(p=>{
    const o={name:p[0]}; if(p[1])o.alt=p[1].split(',').map(s=>s.trim()).filter(Boolean); if(p[2])o.clue=p[2]; return o;});
  if(!title){$('#bmsg').textContent='Введите вопрос.';return;}
  if(items.length<2){$('#bmsg').textContent='Добавьте хотя бы два ответа.';return;}
  const t={id:'c'+Date.now(),title,time:mins*60,items}; const a=load(); a.push(t); save(a); showGame(t);
}

$('#app').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b)return; const act=b.dataset.act, id=b.dataset.id;
  if(act==='home')showHome(); else if(act==='build')showBuilder(); else if(act==='savebuild')saveBuild();
  else if(act==='play')showGame(allTests().find(t=>t.id===id));
  else if(act==='again')showGame(G.t); else if(act==='giveup')finish(); else if(act==='share')share();
  else if(act==='link')copy(linkFor(allTests().find(t=>t.id===id)));
  else if(act==='del'){save(load().filter(t=>t.id!==id));showHome();}
});

/* ---------- start ---------- */
try{const W=window.Telegram&&window.Telegram.WebApp;if(W){W.ready();W.expand();}}catch(e){}
let first=BUILTIN;
if(/^#t=/.test(location.hash)){try{const d=dec(location.hash.slice(3));if(d.title&&Array.isArray(d.items)&&d.items.length)first={id:'shared',title:String(d.title),time:+d.time||360,items:d.items.map(i=>({name:String(i.name),alt:i.alt,clue:i.clue}))};}catch(e){}}
showGame(first);
</script>
